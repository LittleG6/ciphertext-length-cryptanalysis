[project]
name = "substitution-rank-study"
version = "0.1.0"
description = "Reproducible experiments on ciphertext length and the Top-k ranking of the correct plaintext in monoalphabetic substitution ciphers"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
analysis = ["matplotlib>=3.7", "numpy", "pandas", "Pillow"]
dev = ["pytest>=7"]

[project.scripts]
subrank = "substitution_rank.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.setuptools.packages.find]
include = ["substitution_rank*"]
